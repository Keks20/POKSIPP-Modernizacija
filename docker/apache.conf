<VirtualHost *:80>
    DocumentRoot /var/www/poksipp/api/public

    <Directory /var/www/poksipp/api/public>
        # Laravel preko .htaccess salje sve zahteve na index.php
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
